# The word finder's vector species (INTS, BYTES, LANES) must be constants in the image: initialized at run time, they
# are not, and every Vector API operation then runs its Java fallback (about 4x more cycles for a search).
Args = --add-modules=jdk.incubator.vector \
       --initialize-at-build-time=swiss.sib.blastp4j.seed.WordFinder

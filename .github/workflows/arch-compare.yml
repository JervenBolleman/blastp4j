# Compares blastp4j (C2) with BLAST+ (gcc) on x86-64 and on AArch64, to see whether the gap in the X-drop alignment
# loop (register spills: C2 has fewer allocatable registers than gcc on x86-64) shrinks on AArch64.
#
# Per architecture:
# 1. Spills: the stack accesses in Blast_SemiGappedAlign and GappedAligner.semiGapped, static and weighted by
#    cpu-clock samples (.github/scripts/compare-spills.sh); C2's code is printed with hsdis.
# 2. The JMH benchmarks (the BENCHMARK input, default all) with this machine's options from bin/jvm.options
#    plus each variant's own (the VARIANTS input), the variants interleaved over BENCH_ROUNDS rounds.
# 3. A full search, BLAST+ and blastp4j interleaved (bin/compare-blastp.sh), with an async-profiler flame graph.
# The code measured is the CODE input (a branch, tag or commit; default the ref the workflow runs from). With a
# REFERENCE (for a push to main, main before the push), that blastp4j is built too and run in the same rounds of 2
# and 3, each with its own bin/jvm.options plus the same variant options: runners differ
# from run to run (BLAST+ itself took 12% more cycles on one ARM runner than on another), so code is compared within
# one job.
# The database is the Phaseolus vulgaris reference proteome (UP000000226); the queries are its first QUERIES proteins.
#
# The report: each job's sections and machine (CPU model included) go to its step summary and to report/ (the
# report-<arch> artifact); the report job builds an HTML page from them (.github/scripts/report.py), adds it to the
# reports branch as runs/<run id>/ with an index of all runs, and deploys that branch to GitHub Pages.
#
# Hosted runners are virtual machines: hardware counters are usually missing and wall times are noisy, so compare
# the ratios between BLAST+ and blastp4j within one job, not times across jobs. ARM runners are free for public
# repositories only.
#
# Needs cssw4j: the repository in the CSSW4J_REPOSITORY variable, default <owner>/cssw4j.
name: Architecture comparison

on:
  # Daily, on main with the default inputs, to build up a series of runs on the runners' varying CPUs.
  schedule:
    - cron: "17 3 * * *"
  # Each push to main, compared with main before the push.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      queries:
        description: Number of proteome sequences used as queries in the full search
        default: "500"
      rounds:
        description: Timing rounds of the full search
        default: "3"
      variants:
        description: "Benchmark variants, label=JVM options after bin/jvm.options, separated by ;"
        default: "launcher=;oops-on=-XX:+UseCompressedOops;oops-off=-XX:-UseCompressedOops"
      bench_rounds:
        description: Benchmark rounds, the variants interleaved in each
        default: "1"
      code:
        description: blastp4j branch, tag or commit (full 40-character SHA) to measure; empty for the workflow's ref
        default: ""
      reference:
        description: blastp4j branch, tag or commit (full 40-character SHA) to compare with in the same job; empty for none
        default: ""
      benchmark:
        description: JMH benchmarks (a regular expression) for the benchmark step; . for all
        default: "."
      bench_args:
        description: "Further JMH arguments for the benchmark step, such as -p query=HBA_HUMAN or -wi 5 -i 20 (default: each benchmark's own)"
        default: ""

permissions:
  contents: read

env:
  # The inputs, with their defaults for the scheduled runs, which have no inputs.
  QUERIES: ${{ inputs.queries || '500' }}
  ROUNDS: ${{ inputs.rounds || '3' }}
  VARIANTS: ${{ inputs.variants || 'launcher=;oops-on=-XX:+UseCompressedOops;oops-off=-XX:-UseCompressedOops' }}
  BENCH_ROUNDS: ${{ inputs.bench_rounds || '1' }}
  BENCHMARK: ${{ inputs.benchmark || '.' }}
  BENCH_ARGS: ${{ inputs.bench_args }}
  # The reference: the input, or for a push the commit main pointed to before it.
  REFERENCE: ${{ inputs.reference || (github.event_name == 'push' && github.event.before) || '' }}
  BLAST_VERSION: 2.17.0
  JAVA_VERSION: "27"
  ASYNC_PROFILER_VERSION: "4.5"
  PROTEOME_URL: https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/reference_proteomes/Eukaryota/UP000000226/UP000000226_3885.fasta.gz

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            blast: x64-linux
            profiler: linux-x64
          - runner: ubuntu-24.04-arm
            blast: aarch64-linux
            profiler: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      REPORT: ${{ github.workspace }}/report
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code }}
          path: blastp4j
      - uses: actions/checkout@v7
        if: env.REFERENCE
        with:
          ref: ${{ env.REFERENCE }}
          path: reference
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CSSW4J_REPOSITORY || format('{0}/cssw4j', github.repository_owner) }}
          path: cssw4j
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            blastp4j/pom.xml
            cssw4j/pom.xml

      - name: Install packages
        run: |
          sudo apt-get update -q
          # binutils-dev for hsdis; the rest is what the JDK's configure checks for.
          sudo apt-get install -yq binutils-dev autoconf zip unzip file time libasound2-dev libcups2-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
          sudo apt-get install -yq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -yq linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=1
          perf --version

      - name: Machine
        run: |
          mkdir -p "$REPORT"
          {
            echo "Architecture: $(uname -m)"
            echo "CPU model: $(lscpu | sed -n 's/^Model name: *//p' | head -1)"
            echo "Vendor: $(lscpu | sed -n 's/^Vendor ID: *//p' | head -1)"
            echo "CPUs: $(nproc)"
            echo "Memory: $(free -g | awk '/^Mem:/ { print $2 " GB" }')"
            echo "Kernel: $(uname -r)"
            echo "Runner: ${{ matrix.runner }}, image $ImageOS $ImageVersion"
            echo "JDK: $(java -version 2>&1 | sed -n 2p)"
            # What C2 vectorizes with here: AVX level or SVE, and the widest vector (bytes).
            echo "JVM vectors: $(java -XX:+PrintFlagsFinal -version 2>/dev/null |
              awk '$2 ~ /^(UseAVX|UseSVE|MaxVectorSize)$/ { printf "%s%s=%s", s, $2, $4; s = " " }')"
            echo "BLAST+: $BLAST_VERSION"
            echo "Code: \`$(git -C blastp4j rev-parse --short HEAD)\` ($(git -C blastp4j log -1 --format=%s | cut -c1-100))"
            if [ -d reference ]; then echo "Reference: \`$(git -C reference rev-parse --short HEAD)\`"; fi
            echo "Queries: $QUERIES; rounds: $ROUNDS"
          } >"$REPORT/machine.txt"
          {
            echo "## $(uname -m) on ${{ matrix.runner }}"
            echo
            echo '```'
            cat "$REPORT/machine.txt"
            lscpu | grep -E 'Flags' | cut -c1-200
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # hsdis links the system's libbfd, so the cache is per runner image. It is built from the sources of the JDK that
      # setup-java installed: the jdk<feature>u tag of its runtime version (27.0.1.0.2+1 -> jdk-27.0.1.0.2+1).
      - name: Runner image and JDK tag
        id: image
        run: |
          echo "version=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
          runtime=$(sed -n 's/^JAVA_RUNTIME_VERSION="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          echo "jdk-tag=jdk-${runtime%%-*}" >>"$GITHUB_OUTPUT"
          echo "JDK $runtime, hsdis from jdk${JAVA_VERSION}u tag jdk-${runtime%%-*}"
      - name: Cache hsdis
        id: hsdis
        uses: actions/cache@v6
        with:
          path: hsdis
          key: hsdis-binutils-${{ runner.arch }}-${{ steps.image.outputs.jdk-tag }}-${{ steps.image.outputs.version }}
      - name: Build hsdis
        if: steps.hsdis.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "${{ steps.image.outputs.jdk-tag }}" \
            "https://github.com/openjdk/jdk${JAVA_VERSION}u.git" jdk-src
          cd jdk-src
          bash configure --with-boot-jdk="$JAVA_HOME" --with-hsdis=binutils --with-binutils=system >/dev/null
          make build-hsdis
          mkdir -p ../hsdis
          find build -name 'hsdis-*.so' -exec cp {} ../hsdis/ \;
          ls -l ../hsdis
      - name: Install hsdis
        run: cp hsdis/hsdis-*.so "$JAVA_HOME/lib/server/"

      - name: Cache BLAST+
        id: blast
        uses: actions/cache@v6
        with:
          path: ncbi-blast
          key: blast-${{ env.BLAST_VERSION }}-${{ matrix.blast }}
      - name: Download BLAST+
        if: steps.blast.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://ftp.ncbi.nlm.nih.gov/blast/executables/blast+/$BLAST_VERSION/ncbi-blast-$BLAST_VERSION+-${{ matrix.blast }}.tar.gz" |
            tar xz "ncbi-blast-$BLAST_VERSION+/bin/blastp" "ncbi-blast-$BLAST_VERSION+/bin/makeblastdb"
          mv "ncbi-blast-$BLAST_VERSION+" ncbi-blast
      - name: Add BLAST+ to the path
        run: echo "$PWD/ncbi-blast/bin" >>"$GITHUB_PATH"

      - name: Build
        run: |
          mvn -B -q -f cssw4j/pom.xml install -DskipTests
          mvn -B -q -f blastp4j/pom.xml package -DskipTests
          mvn -B -q -f blastp4j/pom.xml dependency:build-classpath -Dmdep.outputFile="$PWD/blastp4j/target/cp.txt"
          if [ -d reference ]; then
            mvn -B -q -f reference/pom.xml package -DskipTests
            mvn -B -q -f reference/pom.xml dependency:build-classpath -Dmdep.outputFile="$PWD/reference/target/cp.txt"
          fi

      - name: Data
        run: |
          mkdir -p data/blastdb
          curl -sSfL "$PROTEOME_URL" | gunzip >data/proteome.fasta
          # The benchmarks read <dir>/blastdb/sprot, <dir>/uniprot_sprot.fasta and (DatabaseLoadBench) its .gz.
          makeblastdb -in data/proteome.fasta -dbtype prot -parse_seqids -out data/blastdb/sprot >/dev/null
          ln -s proteome.fasta data/uniprot_sprot.fasta
          gzip -c data/proteome.fasta >data/uniprot_sprot.fasta.gz
          awk -v n="$QUERIES" '/^>/ { if (++k > n) exit } { print }' data/proteome.fasta >data/queries.fasta
          echo "database: $(grep -c '^>' data/proteome.fasta) sequences; queries: $(grep -c '^>' data/queries.fasta)"

      - name: Spills
        working-directory: blastp4j
        run: |
          QUERY=../data/queries.fasta DB=../data/blastdb/sprot OUT=target/spills .github/scripts/compare-spills.sh |
            tee -a "$GITHUB_STEP_SUMMARY" "$REPORT/report.md"

      - name: Benchmark
        working-directory: blastp4j
        run: |
          base="$(bin/jvm-options)"
          data="$(cd ../data && pwd)"
          out="$PWD/target"
          IFS=';' read -ra variants <<<"$VARIANTS"
          # The code: this checkout, and the reference when there is one, each with its own bin/jvm-options.
          codes=("$(git rev-parse --abbrev-ref HEAD | sed 's/^HEAD$/code/') $(git rev-parse --short HEAD)=$PWD")
          [ -d ../reference ] && codes+=("reference $(git -C ../reference rev-parse --short HEAD)=$(cd ../reference && pwd)")
          for r in $(seq 1 "$BENCH_ROUNDS"); do
            for v in "${variants[@]}"; do
              for k in "${!codes[@]}"; do
                # The benchmarks read their queries from the tree they run in.
                (cd "${codes[$k]#*=}" &&
                  java --add-modules jdk.incubator.vector -cp "target/test-classes:target/classes:$(cat target/cp.txt)" \
                    org.openjdk.jmh.Main "$BENCHMARK" $BENCH_ARGS \
                    -jvmArgsAppend "$(bin/jvm-options)-Dblastp4j.sprot=$data ${v#*=}" \
                    -rf csv -rff "$out/jmh-$k-${v%%=*}-$r.csv" >"$out/jmh-$k-${v%%=*}-$r.log" 2>&1)
              done
            done
          done
          # One column per code, variant and round.
          runs=()
          for r in $(seq 1 "$BENCH_ROUNDS"); do
            for v in "${variants[@]}"; do
              for k in "${!codes[@]}"; do
                label="${codes[$k]%%=*} ${v%%=*}"
                [ "$BENCH_ROUNDS" -gt 1 ] && label+=" $r"
                runs+=("$label=target/jmh-$k-${v%%=*}-$r.csv")
              done
            done
          done
          {
            echo
            echo "### Benchmarks: $BENCHMARK $BENCH_ARGS (one thread; score ± 99.9% error)"
            echo
            echo "bin/jvm-options: \`$base\`"
            echo
            echo "Variants: $(for v in "${variants[@]}"; do printf '%s `%s`; ' "${v%%=*}" "${v#*=}"; done)"
            echo
            python3 .github/scripts/jmh-table.py "${runs[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY" "$REPORT/report.md"

      - name: Full search
        working-directory: blastp4j
        run: |
          curl -sSfL "https://github.com/async-profiler/async-profiler/releases/download/v$ASYNC_PROFILER_VERSION/async-profiler-$ASYNC_PROFILER_VERSION-${{ matrix.profiler }}.tar.gz" |
            tar xz -C ..
          {
            echo
            echo "### Full search, $(nproc) threads"
            echo '```'
            {
            systems=(blast jvm)
            if [ -d ../reference ]; then
              systems+=(ref)
              export REF_JAR="$(ls "$PWD"/../reference/target/blastp4j-*.jar | grep -v -e sources -e javadoc | head -1)"
              export REF_HOME="$(cd ../reference && pwd)"
              echo "jvm: $(git rev-parse --short HEAD), ref: $(git -C ../reference rev-parse --short HEAD)"
            fi
            QUERY=../data/queries.fasta DB=../data/blastdb/sprot THREADS="$(nproc)" ROUNDS="$ROUNDS" OUT=target/compare \
              ASYNC_PROFILER="$(ls "$PWD"/../async-profiler-*/lib/libasyncProfiler.so)" bin/compare-blastp.sh "${systems[@]}"
            } | tee "$REPORT/full-search.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" "$REPORT/report.md"
          cp target/compare/jvm-profile.html "$REPORT/" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compare-${{ runner.arch }}
          path: |
            blastp4j/target/spills/*.s
            blastp4j/target/spills/*.log
            blastp4j/target/jmh-*
            blastp4j/target/compare/*.log
            blastp4j/target/compare/*.txt
            blastp4j/target/compare/jvm-profile.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ runner.arch }}
          path: report

  report:
    needs: compare
    if: always()
    runs-on: ubuntu-24.04
    # One at a time: each run adds its report to the reports branch.
    concurrency:
      group: reports
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          path: code
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
      # The reports branch holds every run's report (runs/<run id>/) and the index; it is created on the first run.
      - name: Reports branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" reports >/dev/null; then
            git clone -q --depth 1 --branch reports "$url" site
          else
            git init -q -b reports site
            git -C site remote add origin "$url"
          fi
      - name: Build the pages
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 code/.github/scripts/report.py run "site/runs/$RUN_ID" reports/*
          python3 code/.github/scripts/report.py index site
      - name: Push the reports branch
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Report of run ${{ github.run_id }} ($(git -C ../code rev-parse --short HEAD))"
          git push -q origin reports
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

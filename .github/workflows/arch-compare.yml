# Compares blastp4j (C2) with BLAST+ (gcc) on x86-64 and on AArch64, to see whether the gap in the X-drop alignment
# loop (register spills: C2 has fewer allocatable registers than gcc on x86-64) shrinks on AArch64.
#
# A build job first makes the jars once, on the AArch64 runner (GitHub's cheaper one), and every measuring job
# unpacks them: the bytecode does not depend on what measures it, and REPEATS jobs an architecture would otherwise
# build it REPEATS times.
#
# Per architecture, REPEATS times over as many jobs, whose rounds the report pools into one row a (architecture, CPU
# model) -- a repeat that landed on another CPU model stays a row of its own, since the x86-64 runners vary. One
# paired measurement of a cell resolves about 1.8% at two standard deviations, which is the size of the differences
# this repository looks for, so a verdict needs the rounds of several jobs and not of one (docs/measurement-power.md).
# Steps 1 and 2 and the diagnostic passes of step 3 run on the first repeat alone, and not at all when DIAGNOSTICS is
# false: each of them runs every system a whole search again, so together they cost about as much as all the timing
# rounds, and they are for understanding a result rather than for reaching one. BASELINE_ROUNDS likewise times BLAST+
# and almostblastp for fewer rounds than the code under test, because BLAST+ repeats to about a third of a percent
# and rounds past the first few tell nothing new about it.
#
# Per architecture:
# 1. Spills: the stack accesses in Blast_SemiGappedAlign and GappedAligner.semiGapped, static and weighted by
#    cpu-clock samples (.github/scripts/compare-spills.sh); C2's code is printed with hsdis.
# 2. The JMH benchmarks (the BENCHMARK input, default all) with this machine's options from bin/jvm.options
#    plus each variant's own (the VARIANTS input), the variants interleaved over BENCH_ROUNDS rounds.
# 3. A full search, BLAST+ and blastp4j interleaved (bin/compare-blastp.sh), and almostblastp when the code has it
#    (the ALMOSTBLASTP input, default true), and BLAST+ blastp -task blastp-fast and fastblastp when the code has it
#    (the FASTBLASTP input, default true), with an async-profiler flame graph and
#    the machine code with the samples of each instruction (<system>-machcode.txt, printed with hsdis) of each JVM
#    program (jvm, almost, fast), and where perf has the core's events (the ARM runner), those by method
#    (<system>-events.txt, bin/events.py).
# The code measured is the CODE input (a branch, tag or commit; default the ref the workflow runs from). With a
# REFERENCE (for a push to main, main before the push), that blastp4j is built too and run in the same rounds of 2
# and 3, each with its own bin/jvm.options plus the same variant options: runners differ
# from run to run (BLAST+ itself took 12% more cycles on one ARM runner than on another), so code is compared within
# one job.
# The database is the human reference proteome (UP000005640); the queries are QUERIES of its proteins, evenly spaced
# over the file, so that the sample's length distribution is the database's and the longest proteins are not all in it
# or all out of it. Until 2026-11-22 it was the Phaseolus vulgaris proteome (UP000000226) and the queries were its
# first 500 proteins, so times before and after that are not comparable: the human workload is about three times the
# instructions (longer proteins, more paralogs), which leaves the JIT's fixed cost a smaller share of the run.
#
# The report: each job's sections and machine (CPU model included) go to its step summary and to report/ (the
# report-<arch> artifact); the report job builds an HTML page from them (.github/scripts/report.py), adds it to the
# reports branch as runs/<run id>/ with an index of all runs, which charts every run's ratios over time and has
# the rounds of each commit, and deploys that branch to GitHub Pages.
#
# Hosted runners are virtual machines: hardware counters are usually missing and wall times are noisy, so compare
# the ratios between BLAST+ and blastp4j within one job, not times across jobs. ARM runners are free for public
# repositories only.
#
# Needs cssw4j: the repository in the CSSW4J_REPOSITORY variable, default <owner>/cssw4j.
name: Architecture comparison

on:
  # On main with the default inputs, to build up a series of runs on the runners' varying CPUs: once on weekdays, five
  # times on Saturdays and Sundays, when GitHub's runners are less loaded (UTC; cssw4j's runs are at other hours).
  schedule:
    - cron: "17 3 * * 1-5"
    - cron: "17 1,6,11,16,21 * * 0,6"
  # Each push to main, compared with main before the push.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      queries:
        description: Number of proteome sequences, evenly spaced over the file, used as queries in the full search
        default: "750"
      rounds:
        description: Timing rounds of the full search, of the code under test (jvm, ref, fast, fastref)
        default: "14"
      baseline_rounds:
        description: "Timing rounds of the baselines (blast, blastfast, almost); empty for as many as the code's"
        default: "3"
      repeats:
        description: "How many times each architecture measures, as separate jobs of this run: their rounds are pooled"
        default: "3"
      diagnostics:
        description: "Also run perf stat, the profiler and the machine-code pass, and the spills and benchmark steps (the first repeat only): true or false"
        default: "true"
      variants:
        description: "Benchmark variants, label=JVM options after bin/jvm.options, separated by ;"
        default: "launcher=;oops-on=-XX:+UseCompressedOops;oops-off=-XX:-UseCompressedOops"
      bench_rounds:
        description: Benchmark rounds, the variants interleaved in each
        default: "1"
      code:
        description: blastp4j branch, tag or commit (full 40-character SHA) to measure; empty for the workflow's ref
        default: ""
      reference:
        description: blastp4j branch, tag or commit (full 40-character SHA) to compare with in the same job; empty for none
        default: ""
      benchmark:
        description: JMH benchmarks (a regular expression) for the benchmark step; . for all
        default: "."
      bench_args:
        description: "Further JMH arguments for the benchmark step, such as -p query=HBA_HUMAN or -wi 5 -i 20 (default: each benchmark's own)"
        default: ""
      almostblastp:
        description: "Also time almostblastp (the code's cli.AlmostBlastp, results may differ slightly) in the full search: true or false"
        default: "true"
      fastblastp:
        description: "Also time BLAST+ blastp -task blastp-fast and fastblastp (the code's cli.FastBlastp, its results) in the full search: true or false"
        default: "true"
      fast_queries:
        description: "Number of proteome sequences used as queries by blastp-fast and fastblastp (more than for blastp, so that the JIT's warm-up does not dominate)"
        default: "1800"

permissions:
  contents: read

env:
  # The inputs, with their defaults for the scheduled runs, which have no inputs.
  QUERIES: ${{ inputs.queries || '750' }}
  ROUNDS: ${{ inputs.rounds || '14' }}
  BASELINE_ROUNDS: ${{ inputs.baseline_rounds || '3' }}
  REPEATS: ${{ inputs.repeats || '3' }}
  VARIANTS: ${{ inputs.variants || 'launcher=;oops-on=-XX:+UseCompressedOops;oops-off=-XX:-UseCompressedOops' }}
  BENCH_ROUNDS: ${{ inputs.bench_rounds || '1' }}
  BENCHMARK: ${{ inputs.benchmark || '.' }}
  BENCH_ARGS: ${{ inputs.bench_args }}
  ALMOSTBLASTP: ${{ inputs.almostblastp || 'true' }}
  FASTBLASTP: ${{ inputs.fastblastp || 'true' }}
  FAST_QUERIES: ${{ inputs.fast_queries || '1800' }}
  # The reference: the input, or for a push the commit main pointed to before it.
  REFERENCE: ${{ inputs.reference || (github.event_name == 'push' && github.event.before) || '' }}
  BLAST_VERSION: 2.17.0
  JAVA_VERSION: "27"
  ASYNC_PROFILER_VERSION: "4.5"
  PROTEOME_URL: https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/reference_proteomes/Eukaryota/UP000005640/UP000005640_9606.fasta.gz

jobs:
  # The jars once, for every measuring job: they are the same bytecode whatever measures them, and building them in
  # each job would build them REPEATS times an architecture. On the AArch64 runner, which GitHub bills at $0.005 a
  # minute against $0.006 for x86-64 and calls the more efficient of the two; the repository is public, so neither
  # costs anything here, but the cheaper one is the one to idle on. The artifact is self-contained -- the
  # dependencies are copied beside the classes and target/cp.txt names them relatively -- so a measuring job needs
  # no Maven, no repository of its own and no cssw4j checkout.
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      repeats: ${{ steps.plan.outputs.repeats }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code }}
          path: blastp4j
      - uses: actions/checkout@v7
        if: env.REFERENCE
        with:
          ref: ${{ env.REFERENCE }}
          path: reference
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CSSW4J_REPOSITORY || format('{0}/cssw4j', github.repository_owner) }}
          path: cssw4j
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            blastp4j/pom.xml
            cssw4j/pom.xml
      - name: Build
        run: |
          mvn -B -q -f cssw4j/pom.xml install -DskipTests
          for d in blastp4j reference; do
            [ -d "$d" ] || continue
            mvn -B -q -f "$d/pom.xml" package -DskipTests
            # The dependencies beside the classes, and a classpath of paths relative to the tree, so that the jobs
            # that measure need nothing from ~/.m2.
            mvn -B -q -f "$d/pom.xml" dependency:copy-dependencies -DincludeScope=test \
              -DoutputDirectory="$PWD/$d/target/lib"
            (cd "$d" && ls target/lib/*.jar | paste -sd: >target/cp.txt)
          done
      - name: Pack
        # One archive rather than the trees themselves: upload-artifact roots an artifact at the least common
        # ancestor of its paths, which without a reference checkout is blastp4j/target and would lose the tree the
        # measuring jobs unpack into. It is also thousands of class files, which travel better as one file.
        run: tar czf jars.tgz blastp4j/target $([ -d reference/target ] && echo reference/target)
      - name: Repeats
        id: plan
        run: echo "repeats=[$(seq 1 "$REPEATS" | paste -sd,)]" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: jars.tgz
          retention-days: 1
          if-no-files-found: error

  compare:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm]
        repeat: ${{ fromJSON(needs.build.outputs.repeats) }}
        include:
          - arch: x64
            runner: ubuntu-24.04
            blast: x64-linux
            profiler: linux-x64
          - arch: arm
            runner: ubuntu-24.04-arm
            blast: aarch64-linux
            profiler: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      REPORT: ${{ github.workspace }}/report
      # The diagnostic passes cost about as much as all the timing rounds, and one job's worth of them says
      # everything the others' would: the first repeat runs them, the rest spend the time on rounds instead.
      DIAGNOSTICS: ${{ matrix.repeat == 1 && (inputs.diagnostics || 'true') || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code }}
          path: blastp4j
      - uses: actions/checkout@v7
        if: env.REFERENCE
        with:
          ref: ${{ env.REFERENCE }}
          path: reference
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # The jars, the classes and their dependencies as the build job made them, into the trees just checked out.
      - uses: actions/download-artifact@v8
        with:
          name: jars
      - name: Unpack
        run: |
          tar xzf jars.tgz
          ls -l blastp4j/target/blastp4j-*.jar

      - name: Install packages
        run: |
          sudo apt-get update -q
          # binutils-dev for hsdis; the rest is what the JDK's configure checks for.
          sudo apt-get install -yq binutils-dev autoconf zip unzip file time libasound2-dev libcups2-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
          sudo apt-get install -yq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -yq linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=1
          perf --version

      - name: Machine
        run: |
          mkdir -p "$REPORT"
          {
            echo "Architecture: $(uname -m)"
            echo "CPU model: $(lscpu | sed -n 's/^Model name: *//p' | head -1)"
            echo "Vendor: $(lscpu | sed -n 's/^Vendor ID: *//p' | head -1)"
            echo "CPUs: $(nproc)"
            echo "Memory: $(free -g | awk '/^Mem:/ { print $2 " GB" }')"
            echo "Kernel: $(uname -r)"
            echo "Runner: ${{ matrix.runner }}, image $ImageOS $ImageVersion"
            echo "JDK: $(java -version 2>&1 | sed -n 2p)"
            # What C2 vectorizes with here: AVX level or SVE, and the widest vector (bytes).
            echo "JVM vectors: $(java -XX:+PrintFlagsFinal -version 2>/dev/null |
              awk '$2 ~ /^(UseAVX|UseSVE|MaxVectorSize)$/ { printf "%s%s=%s", s, $2, $4; s = " " }')"
            # The options this machine actually gets, which is what bin/blastp4j and bin/compare-blastp.sh run with:
            # the machine-dependent lines of bin/jvm.options resolved, so that the report says which runs had 512-bit
            # vectors (the [avx512] lines) or the row kernel ([aarch64]) rather than leaving it to be inferred from
            # the CPU model. report.py marks the 512-bit runs on the history chart from this.
            echo "CPU family: $(lscpu | sed -n 's/^CPU family: *//p' | head -1)"
            echo "JVM options: $(sh blastp4j/bin/jvm-options)"
            echo "BLAST+: $BLAST_VERSION"
            echo "Code: \`$(git -C blastp4j rev-parse --short HEAD)\` ($(git -C blastp4j log -1 --format=%s | cut -c1-100))"
            if [ -d reference ]; then echo "Reference: \`$(git -C reference rev-parse --short HEAD)\`"; fi
            # Named, because the workload changed on 2026-11-22 and times across the change are not comparable.
            echo "Proteome: $(basename "$PROTEOME_URL" .fasta.gz)"
            echo "Queries: $QUERIES, evenly spaced (blastp-fast: $FAST_QUERIES); rounds: $ROUNDS"
          } >"$REPORT/machine.txt"
          {
            echo "## $(uname -m) on ${{ matrix.runner }}"
            echo
            echo '```'
            cat "$REPORT/machine.txt"
            lscpu | grep -E 'Flags' | cut -c1-200
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # hsdis links the system's libbfd, so the cache is per runner image. It is built from the sources of the JDK that
      # setup-java installed: the jdk<feature>u tag of its runtime version (27.0.1.0.2+1 -> jdk-27.0.1.0.2+1).
      - name: Runner image and JDK tag
        id: image
        run: |
          echo "version=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
          runtime=$(sed -n 's/^JAVA_RUNTIME_VERSION="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          echo "jdk-tag=jdk-${runtime%%-*}" >>"$GITHUB_OUTPUT"
          echo "JDK $runtime, hsdis from jdk${JAVA_VERSION}u tag jdk-${runtime%%-*}"
      - name: Cache hsdis
        id: hsdis
        if: env.DIAGNOSTICS == 'true'
        uses: actions/cache@v6
        with:
          path: hsdis
          key: hsdis-binutils-${{ runner.arch }}-${{ steps.image.outputs.jdk-tag }}-${{ steps.image.outputs.version }}
      - name: Build hsdis
        if: env.DIAGNOSTICS == 'true' && steps.hsdis.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "${{ steps.image.outputs.jdk-tag }}" \
            "https://github.com/openjdk/jdk${JAVA_VERSION}u.git" jdk-src
          cd jdk-src
          bash configure --with-boot-jdk="$JAVA_HOME" --with-hsdis=binutils --with-binutils=system >/dev/null
          make build-hsdis
          mkdir -p ../hsdis
          find build -name 'hsdis-*.so' -exec cp {} ../hsdis/ \;
          ls -l ../hsdis
      - name: Install hsdis
        if: env.DIAGNOSTICS == 'true'
        run: cp hsdis/hsdis-*.so "$JAVA_HOME/lib/server/"

      - name: Cache BLAST+
        id: blast
        uses: actions/cache@v6
        with:
          path: ncbi-blast
          key: blast-${{ env.BLAST_VERSION }}-${{ matrix.blast }}
      - name: Download BLAST+
        if: steps.blast.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://ftp.ncbi.nlm.nih.gov/blast/executables/blast+/$BLAST_VERSION/ncbi-blast-$BLAST_VERSION+-${{ matrix.blast }}.tar.gz" |
            tar xz "ncbi-blast-$BLAST_VERSION+/bin/blastp" "ncbi-blast-$BLAST_VERSION+/bin/makeblastdb"
          mv "ncbi-blast-$BLAST_VERSION+" ncbi-blast
      - name: Add BLAST+ to the path
        run: echo "$PWD/ncbi-blast/bin" >>"$GITHUB_PATH"

      - name: Cache async-profiler
        id: profiler
        uses: actions/cache@v6
        with:
          path: async-profiler
          key: async-profiler-${{ env.ASYNC_PROFILER_VERSION }}-${{ matrix.profiler }}
      - name: Download async-profiler
        if: steps.profiler.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/async-profiler/async-profiler/releases/download/v$ASYNC_PROFILER_VERSION/async-profiler-$ASYNC_PROFILER_VERSION-${{ matrix.profiler }}.tar.gz" |
            tar xz
          mv "async-profiler-$ASYNC_PROFILER_VERSION-${{ matrix.profiler }}" async-profiler

      - name: Data
        run: |
          mkdir -p data/blastdb
          curl -sSfL "$PROTEOME_URL" | gunzip >data/proteome.fasta
          # The benchmarks read <dir>/blastdb/sprot, <dir>/uniprot_sprot.fasta and (DatabaseLoadBench) its .gz.
          makeblastdb -in data/proteome.fasta -dbtype prot -parse_seqids -out data/blastdb/sprot >/dev/null
          ln -s proteome.fasta data/uniprot_sprot.fasta
          gzip -c data/proteome.fasta >data/uniprot_sprot.fasta.gz
          # n of the proteome's t sequences, evenly spaced over the file: the sample's length distribution is the
          # database's, where a prefix of the file need not be (the first proteins of a proteome are not a sample).
          total=$(grep -c '^>' data/proteome.fasta)
          sample() {
            awk -v n="$1" -v t="$total" '/^>/ { k++; take = int((k - 1) * n / t) < int(k * n / t) } take' \
              data/proteome.fasta
          }
          sample "$QUERIES" >data/queries.fasta
          sample "$FAST_QUERIES" >data/fast-queries.fasta
          echo "database: $total sequences; queries: $(grep -c '^>' data/queries.fasta)," \
            "blastp-fast: $(grep -c '^>' data/fast-queries.fasta)"

      - name: Spills
        if: env.DIAGNOSTICS == 'true'
        working-directory: blastp4j
        run: |
          QUERY=../data/queries.fasta DB=../data/blastdb/sprot OUT=target/spills .github/scripts/compare-spills.sh |
            tee -a "$GITHUB_STEP_SUMMARY" "$REPORT/report.md"

      - name: Benchmark
        if: env.DIAGNOSTICS == 'true'
        working-directory: blastp4j
        run: |
          base="$(bin/jvm-options)"
          data="$(cd ../data && pwd)"
          out="$PWD/target"
          IFS=';' read -ra variants <<<"$VARIANTS"
          # The code: this checkout, and the reference when there is one, each with its own bin/jvm-options.
          codes=("$(git rev-parse --abbrev-ref HEAD | sed 's/^HEAD$/code/') $(git rev-parse --short HEAD)=$PWD")
          [ -d ../reference ] && codes+=("reference $(git -C ../reference rev-parse --short HEAD)=$(cd ../reference && pwd)")
          for r in $(seq 1 "$BENCH_ROUNDS"); do
            for v in "${variants[@]}"; do
              for k in "${!codes[@]}"; do
                # The benchmarks read their queries from the tree they run in.
                (cd "${codes[$k]#*=}" &&
                  java --add-modules jdk.incubator.vector -cp "target/test-classes:target/classes:$(cat target/cp.txt)" \
                    org.openjdk.jmh.Main "$BENCHMARK" $BENCH_ARGS \
                    -jvmArgsAppend "$(bin/jvm-options)-Dblastp4j.sprot=$data ${v#*=}" \
                    -rf csv -rff "$out/jmh-$k-${v%%=*}-$r.csv" >"$out/jmh-$k-${v%%=*}-$r.log" 2>&1)
              done
            done
          done
          # One column per code, variant and round.
          runs=()
          for r in $(seq 1 "$BENCH_ROUNDS"); do
            for v in "${variants[@]}"; do
              for k in "${!codes[@]}"; do
                label="${codes[$k]%%=*} ${v%%=*}"
                [ "$BENCH_ROUNDS" -gt 1 ] && label+=" $r"
                runs+=("$label=target/jmh-$k-${v%%=*}-$r.csv")
              done
            done
          done
          {
            echo
            echo "### Benchmarks: $BENCHMARK $BENCH_ARGS (one thread; score ± 99.9% error)"
            echo
            echo "bin/jvm-options: \`$base\`"
            echo
            echo "Variants: $(for v in "${variants[@]}"; do printf '%s `%s`; ' "${v%%=*}" "${v#*=}"; done)"
            echo
            python3 .github/scripts/jmh-table.py "${runs[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY" "$REPORT/report.md"

      - name: Full search
        working-directory: blastp4j
        run: |
          {
            echo
            echo "### Full search, $(nproc) threads"
            echo '```'
            {
            systems=(blast jvm)
            # almostblastp from the same jar, where the code has it.
            if [ "$ALMOSTBLASTP" = true ] && unzip -l target/blastp4j-*[0-9T].jar 2>/dev/null | grep -q 'cli/AlmostBlastp.class'; then
              systems+=(almost)
            fi
            # blastp -task blastp-fast and fastblastp, compared with each other, where the code has fastblastp.
            if [ "$FASTBLASTP" = true ] && unzip -l target/blastp4j-*[0-9T].jar 2>/dev/null | grep -q 'cli/FastBlastp.class'; then
              systems+=(blastfast fast)
            fi
            if [ -d ../reference ]; then
              systems+=(ref)
              # The reference's fastblastp too, where it has one and fastblastp runs.
              if [[ " ${systems[*]} " == *" fast "* ]] && unzip -l ../reference/target/blastp4j-*[0-9T].jar 2>/dev/null | grep -q 'cli/FastBlastp.class'; then
                systems+=(fastref)
              fi
              export REF_JAR="$(ls "$PWD"/../reference/target/blastp4j-*.jar | grep -v -e sources -e javadoc | head -1)"
              export REF_HOME="$(cd ../reference && pwd)"
              echo "jvm: $(git rev-parse --short HEAD), ref: $(git -C ../reference rev-parse --short HEAD)"
            fi
            QUERY=../data/queries.fasta FAST_QUERY=../data/fast-queries.fasta DB=../data/blastdb/sprot THREADS="$(nproc)" \
              ROUNDS="$ROUNDS" BASELINE_ROUNDS="$BASELINE_ROUNDS" DIAGNOSTICS="$DIAGNOSTICS" OUT=target/compare \
              ASYNC_PROFILER="$(cd .. && pwd)/async-profiler/lib/libasyncProfiler.so" bin/compare-blastp.sh "${systems[@]}"
            } | tee "$REPORT/full-search.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" "$REPORT/report.md"
          cp target/compare/*-profile.html target/compare/*-machcode.txt target/compare/*-events.txt "$REPORT/" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compare-${{ runner.arch }}-${{ matrix.repeat }}
          path: |
            blastp4j/target/spills/*.s
            blastp4j/target/spills/*.log
            blastp4j/target/jmh-*
            blastp4j/target/compare/*.log
            blastp4j/target/compare/*.txt
            blastp4j/target/compare/*-profile.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ runner.arch }}-${{ matrix.repeat }}
          path: report

  report:
    needs: compare
    if: always()
    runs-on: ubuntu-24.04
    # One at a time: each run adds its report to the reports branch.
    concurrency:
      group: reports
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          path: code
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
      # The reports branch holds every run's report (runs/<run id>/) and the index; it is created on the first run.
      - name: Reports branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" reports >/dev/null; then
            git clone -q --depth 1 --branch reports "$url" site
          else
            git init -q -b reports site
            git -C site remote add origin "$url"
          fi
      - name: Build the pages
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 code/.github/scripts/report.py run "site/runs/$RUN_ID" reports/*
          python3 code/.github/scripts/report.py index site
      - name: Push the reports branch
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Report of run ${{ github.run_id }} ($(git -C ../code rev-parse --short HEAD))"
          git push -q origin reports
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
